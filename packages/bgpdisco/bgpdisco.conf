package 'bgpdisco'

config general
	option debug '0'
	option refresh_local_data_interval '60'
	# Minimum seconds between two runs of the data handlers (hosts file, dnsmasq reload)
	option handler_min_interval '30'
	option nice '19'
	# Seconds between two comparisons of the babel neighbors with the BGP sessions.
	# After a link came up they are compared every second for half a minute.
	option peer_sync_interval '30'
	# Seconds a BGP session stays configured after babel lost the neighbor
	option peer_removal_delay '300'

config bird
	option control_socket '/var/run/bird.ctl'
	option config_target '/dev/shm/bird_bgpdisco.conf'
	option config_template '/usr/share/ucode/bgpdisco/bird_config_template.ut'
	option bgp_address '::1'
	option bgp_port '179'
	option graceful_restart_time '120'
	# VRF of the mesh interfaces, if they are in one
	#option vrf 'vrf_freifunk'
